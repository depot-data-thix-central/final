name: Build THIX ID Production

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Flutter pub get
        run: flutter pub get


      # ==========================================
      # ANDROID SIGNING
      # ==========================================

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release-keystore.jks" >> android/key.properties


      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks


      - name: Verify signing files
        run: |
          test -s android/key.properties
          test -s android/app/release-keystore.jks

          echo "Signing files successfully created."


      # ==========================================
      # BUILD AAB (Sans offuscation)
      # ==========================================

      - name: Build release App Bundle
        run: |
          flutter build appbundle \
            --release \
            --dart-define="SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --dart-define="SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"

      # ==========================================
      # BUILD APK (Sans offuscation)
      # ==========================================

      - name: Build release APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define="SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --dart-define="SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"


      # ==========================================
      # VERIFY BUILD OUTPUTS
      # ==========================================

      - name: Verify release artifacts
        run: |
          test -f build/app/outputs/bundle/release/app-release.aab
          test -n "$(find build/app/outputs/flutter-apk -name '*.apk' -print -quit)"

          echo "======================================"
          echo "THIX ID RELEASE BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "AAB:"
          ls -lh build/app/outputs/bundle/release/app-release.aab
          echo ""
          echo "APKs:"
          ls -lh build/app/outputs/flutter-apk/*.apk


      # ==========================================
      # UPLOAD AAB
      # ==========================================

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: thix-id-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # UPLOAD APKs
      # ==========================================

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: thix-id-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # CLEANUP
      # ==========================================

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/app/release-keystore.jks
          rm -f android/key.properties
