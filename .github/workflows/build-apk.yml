name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      # ✅ Obfuscation activée : le code Dart est obscurci, les symboles de
      # debug sont extraits à part (nécessaires pour décoder les stack traces
      # de crash plus tard, ex. avec Firebase Crashlytics ou Sentry).
      - name: Build release App Bundle
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build release APKs (split by ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload split APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks-split
          path: build/app/outputs/flutter-apk/*.apk

      # ✅ Sans cet artefact, les symboles de debug obfusqués sont perdus
      # après le build — impossible de déobfusquer un crash reçu en prod.
      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-debug-symbols
          path: build/app/outputs/symbols
          retention-days: 90
